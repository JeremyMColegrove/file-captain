# Copy to docker-compose.yml and replace the image name.
# In .env, DATABASE_URL must point at the "db" service, not localhost:
#   DATABASE_URL="postgresql://<POSTGRES_USER>:<POSTGRES_PASSWORD>@db:5432/<POSTGRES_DB>"
# and BETTER_AUTH_URL must be the URL the app is served at.
services:
  db:
    image: postgres:18.3-alpine
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - app-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: <your-dockerhub-username>/file-captain:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Files the app writes get this owner. Find yours with `id -u` / `id -g`.
      PUID: 1000
      PGID: 1000
    ports:
      - "3000:3000"
    volumes:
      # config.yaml is read from /config/config.yaml (override with CONFIG_PATH).
      - ./config.yaml:/config/config.yaml:ro
      # Thumbnail cache and audit log (server.cacheDir / server.auditLog).
      - ./data:/data
      # One line per folder in config.yaml: <host path>:<container path>.
      # The container path (right side) is what goes in that folder's `path:`.
      # PUID:PGID must be able to write the host directories.
      - /mnt/media/shared/global:/mnt/media/shared/global
      - /mnt/media/shared/jeremy:/mnt/media/shared/jeremy
      - /mnt/media/shared/family:/mnt/media/shared/family
volumes:
  app-data:
